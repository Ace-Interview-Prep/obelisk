apply plugin: 'com.android.application'

android {
    namespace 'com.jenga.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.jenga.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Copy WASM frontend into assets before build
    preBuild.doFirst {
        def wasmDir = file("src/main/assets/frontend")
        if (!wasmDir.exists()) {
            logger.warn("WARNING: src/main/assets/frontend not found. Run 'nix-build' first and copy the WASM output.")
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
